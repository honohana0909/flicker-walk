<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>歩行統制フリッカー（ローカル音対策完了版）</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; user-select: none; }
        #flicker-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        
        /* 実験中（フルスクリーン時）はマウスカーソルを完全に非表示にする */
        :fullscreen #flicker-container { cursor: none; }
        
        /* 左右の丸を並べるエリア */
        #stage { display: flex; gap: 600px; z-index: 1; } 
        
        /* 丸の基本スタイル（位置固定のため常に配置） */
        .circle { width: 150px; height: 150px; border-radius: 50%; background-color: #000; }
        
        #countdown { position: absolute; color: #FFF; font-size: 140px; font-weight: bold; display: none; z-index: 10; text-shadow: 0 0 20px #000; pointer-events: none; }
        
        /* 操作パネル */
        #config-panel { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.95); padding: 20px; border-radius: 8px; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); color: #000; width: 220px; }
        .control-group { margin-bottom: 15px; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-weight: bold; width: 100%; }
        select, input[type="range"] { width: 100%; margin-top: 5px; padding: 4px; box-sizing: border-box; }

        /* オーディオ有効化用の案内画面スタイル */
        #audio-init-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); color: #fff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold; cursor: pointer;
        }
        #audio-init-overlay button {
            margin-top: 20px; padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: auto;
        }
    </style>
</head>
<body>

    <!-- ブラウザの音ブロックを確実に解除するための画面 -->
    <div id="audio-init-overlay">
        <div>実験準備：下のボタンを押して音声を有効にしてください</div>
        <button id="audio-init-btn">🔊 音声を有効にして始める</button>
    </div>

    <!-- 操作パネル -->
    <div id="config-panel">
        <div class="control-group">
            <label style="font-weight: bold;">全体テンポ (BPM): <span id="bpm-val">110</span></label><br>
            <input type="range" id="bpm-slider" min="60" max="200" value="110">
        </div>
        
        <div class="control-group">
            <label style="font-weight: bold;">点滅モード:</label><br>
            <select id="mode-select">
                <option value="alternate">左右交互（右スタート）</option>
                <option value="simultaneous">表示のみ（中央に1つ）</option>
            </select>
        </div>

        <!-- 使用するモニターのリフレッシュレート設定項目 -->
        <div class="control-group">
            <label style="font-weight: bold;">使用モニター (Hz):</label><br>
            <select id="hz-select">
                <option value="60">60 Hzモニター</option>
                <option value="120">120 Hzモニター</option>
                <option value="144">144 Hzモニター</option>
                <option value="240">240 Hzモニター</option>
            </select>
            <p style="margin: 3px 0 0 0; font-size: 11px; color: #555;">※点灯時間を一律 約100ms に統制します</p>
        </div>

        <div class="control-group">
            <button id="start-btn">▶ 実験開始</button>
        </div>
        <div>
            <p style="margin: 0; font-size: 11px; color: #666; text-align: center;">※キーボードの Esc キーで解除・停止</p>
        </div>
    </div>

    <!-- 実験画面 -->
    <div id="flicker-container">
        <div id="countdown"></div>
        <div id="stage">
            <div id="circle-left" class="circle"></div>
            <div id="circle-right" class="circle"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('flicker-container');
        const stage = document.getElementById('stage');
        const leftCircle = document.getElementById('circle-left');
        const rightCircle = document.getElementById('circle-right');
        const slider = document.getElementById('bpm-slider');
        const bpmVal = document.getElementById('bpm-val');
        const modeSelect = document.getElementById('mode-select');
        const hzSelect = document.getElementById('hz-select'); 
        const startBtn = document.getElementById('start-btn');
        const configPanel = document.getElementById('config-panel');
        const countdownDisplay = document.getElementById('countdown');
        
        const audioInitOverlay = document.getElementById('audio-init-overlay');
        const audioInitBtn = document.getElementById('audio-init-btn');

        let bpm = 110;
        let mode = 'alternate';
        let isPlaying = false;
        let isSoundEnabled = true; 
        let lastTimestamp = 0;
        let beatCount = 0; 
        
        // 初期値は60Hz用の「3フレーム」に設定。選択肢によって変動。
        let flashFrames = 6; 
        let currentFlashFrameCount = 0; 

        let audioCtx = null;

        // 電子音を生成して即座に鳴らす、最もクリーンな関数
        function forcePlayTone(frequency, durationMs) {
            try {
                // 音声コンテキストが作成されていない、または停止している場合は即座に作成・再開を試みる
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator(); 
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.value = frequency; 
                
                const startTime = audioCtx.currentTime;
                const endTime = startTime + (durationMs / 1000);
                
                gainNode.gain.setValueAtTime(0.3, startTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.001, endTime); 
                
                osc.start(startTime);
                osc.stop(endTime);
            } catch (e) {
                console.error("発音エラー:", e);
            }
        }

        function playTone(frequency, durationMs) {
            if (!isSoundEnabled) return; 
            forcePlayTone(frequency, durationMs);
        }

        // 青い「音声を有効にして始める」ボタンが押されたときの処理
        audioInitBtn.addEventListener('click', () => {
            // 最初の一歩で確実に回路を初期化して起こす
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            audioCtx.resume().then(() => {
                forcePlayTone(1000, 30); // 起動テスト音「プッ」
                audioInitOverlay.style.display = 'none'; // 案内画面を隠す
            }).catch(err => {
                console.error("Audio resume error:", err);
                audioInitOverlay.style.display = 'none';
            });
        });

        slider.addEventListener('input', (e) => { bpm = e.target.value; bpmVal.textContent = bpm; });
        modeSelect.addEventListener('change', (e) => { mode = e.target.value; });
        
        // モニター選択（Hz）が変更されたときの処理
        hzSelect.addEventListener('change', (e) => {
            const hz = parseInt(e.target.value);
            if (hz === 120) {
                flashFrames = 12;
            } else if (hz === 144) {
                flashFrames = 14;
            } else if (hz === 240) {
                flashFrames = 24;
            } else {
                flashFrames = 6; 
            }
        });

        // 「▶ 実験開始」ボタンを押したときの処理
        startBtn.addEventListener('click', () => {
            // 実験開始のクリック時にも、しつこいくらい確実にオーディオ回路を再起動させる
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (mode === 'simultaneous') {
                stage.style.gap = '0px';
                leftCircle.style.display = 'none'; 
            } else {
                stage.style.gap = '600px'; 
                leftCircle.style.display = 'block'; 
            }
            
            leftCircle.style.backgroundColor = '#000';
            rightCircle.style.backgroundColor = '#000';

            document.documentElement.requestFullscreen().then(() => {
                configPanel.style.display = 'none';
                isSoundEnabled = true; 
                isPlaying = true;
                beatCount = 0; 
                currentFlashFrameCount = 0;
                lastTimestamp = performance.now();
                runCountdown();
            }).catch(err => {
                alert(`フルスクリーンエラー: ${err.message}`);
            });
        });

        // カウントダウン制御
        function runCountdown() {
            countdownDisplay.style.display = 'block';
            let count = 3;
            countdownDisplay.textContent = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDisplay.textContent = count;
                } else {
                    clearInterval(timer);
                    countdownDisplay.style.display = 'none'; 
                    isSoundEnabled = false; // ★ここで本番消音モード
                }
            }, 1000);
        }

        // フルスクリーン終了時（Esc解除）のリセット
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                isPlaying = false;
                isSoundEnabled = false;
                leftCircle.style.display = 'block'; 
                leftCircle.style.backgroundColor = '#000';
                rightCircle.style.backgroundColor = '#000';
                countdownDisplay.style.display = 'none';
                configPanel.style.display = 'block';
            }
        });

        // アニメーションループ
        function loop(timestamp) {
            if (isPlaying) {
                const interval = 60000 / bpm; 
                const elapsed = timestamp - lastTimestamp;

                if (elapsed >= interval) {
                    if (mode === 'simultaneous') {
                        rightCircle.style.backgroundColor = '#FFF'; 
                    } else {
                        if (beatCount % 2 === 0) {
                            leftCircle.style.backgroundColor = '#000';
                            rightCircle.style.backgroundColor = '#FFF'; 
                        } else {
                            leftCircle.style.backgroundColor = '#FFF'; 
                            rightCircle.style.backgroundColor = '#000';
                        }
                    }
                    
                    playTone(800, 50); // カウントダウン中（3, 2, 1）だけ音がピッと鳴る
                    
                    beatCount++;
                    currentFlashFrameCount = 1; 
                    lastTimestamp = timestamp - (elapsed % interval); 
                } 
                else if (currentFlashFrameCount > 0) {
                    currentFlashFrameCount++;
                    if (currentFlashFrameCount > flashFrames) {
                        leftCircle.style.backgroundColor = '#000';
                        rightCircle.style.backgroundColor = '#000';
                        currentFlashFrameCount = 0; 
                    }
                }
            }
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
