<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>歩行統制フリッカー（完全版・音トラブル対策済）</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; user-select: none; }
        #flicker-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        :fullscreen #flicker-container { cursor: none; }
        #stage { display: flex; gap: 600px; z-index: 1; } 
        .circle { width: 150px; height: 150px; background-color: #FFF; border-radius: 50%; opacity: 0; transition: opacity 0s; }
        .circle::after { content: attr(data-label); display: flex; justify-content: center; align-items: center; height: 100%; color: #000; font-size: 40px; font-weight: bold; }
        #countdown { position: absolute; color: #FFF; font-size: 140px; font-weight: bold; display: none; z-index: 10; text-shadow: 0 0 20px #000; pointer-events: none; }
        
        /* 操作パネル */
        #config-panel { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.95); padding: 20px; border-radius: 8px; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); color: #000; }
        .control-group { margin-bottom: 15px; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-weight: bold; }
        select, input[type="range"] { width: 100%; margin-top: 5px; }

        /* ★オーディオ有効化用の案内画面スタイル */
        #audio-init-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); color: #fff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold; cursor: pointer;
        }
        #audio-init-overlay button {
            margin-top: 20px; padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ★GitHub対応：ブラウザの音ブロックを確実に解除するための画面 -->
    <div id="audio-init-overlay">
        <div>実験準備：下のボタンを押して音声を有効にしてください</div>
        <button id="audio-init-btn">🔊 音声を有効にして始める</button>
    </div>

    <!-- 操作パネル -->
    <div id="config-panel">
        <div class="control-group">
            <label style="font-weight: bold;">全体テンポ (BPM): <span id="bpm-val">110</span></label><br>
            <input type="range" id="bpm-slider" min="60" max="200" value="110">
        </div>
        <div class="control-group">
            <label style="font-weight: bold;">点滅モード:</label><br>
            <select id="mode-select">
                <option value="alternate">左右交互（右スタート）</option>
                <option value="simultaneous">表示のみ</option>
            </select>
        </div>
        <div class="control-group">
            <button id="start-btn">▶ 実験開始</button>
        </div>
        <div>
            <p style="margin: 0; font-size: 11px; color: #666;">※キーボードの Esc キーで解除・停止</p>
        </div>
    </div>

    <!-- 実験画面 -->
    <div id="flicker-container">
        <div id="countdown"></div>
        <div id="stage">
            <div id="circle-left" class="circle" data-label=""></div>
            <div id="circle-right" class="circle" data-label=""></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('flicker-container');
        const stage = document.getElementById('stage');
        const leftCircle = document.getElementById('circle-left');
        const rightCircle = document.getElementById('circle-right');
        const slider = document.getElementById('bpm-slider');
        const bpmVal = document.getElementById('bpm-val');
        const modeSelect = document.getElementById('mode-select');
        const startBtn = document.getElementById('start-btn');
        const configPanel = document.getElementById('config-panel');
        const countdownDisplay = document.getElementById('countdown');
        
        // オーディオ初期化用要素
        const audioInitOverlay = document.getElementById('audio-init-overlay');
        const audioInitBtn = document.getElementById('audio-init-btn');

        let bpm = 110;
        let mode = 'alternate';
        let isPlaying = false;
        let isSoundEnabled = true; 
        let lastTimestamp = 0;
        let beatCount = 0; 
        const flashDuration = 50; 

        let audioCtx = null;

        // ★最初のボタンクリックで確実にブラウザの音声を解放する処理
        audioInitBtn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            // 音が有効になったら案内画面を消す
            audioInitOverlay.style.display = 'none';
        });

        function playTone(frequency, durationMs) {
            if (!audioCtx || !isSoundEnabled) return; 
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.value = frequency; 
            
            const startTime = audioCtx.currentTime;
            const endTime = startTime + (durationMs / 1000);
            
            gainNode.gain.setValueAtTime(0.3, startTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, endTime); 
            
            osc.start(startTime);
            osc.stop(endTime);
        }

        slider.addEventListener('input', (e) => { bpm = e.target.value; bpmVal.textContent = bpm; });
        modeSelect.addEventListener('change', (e) => { mode = e.target.value; });

        // 実験開始
        startBtn.addEventListener('click', () => {
            // ここでも念のため再アクティブ化
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (mode === 'simultaneous') {
                stage.style.gap = '0px';
                leftCircle.style.display = 'none'; 
                rightCircle.setAttribute('data-label', ''); 
            } else {
                stage.style.gap = ''; 
                leftCircle.style.display = 'block';
                rightCircle.setAttribute('data-label', '');
            }

            document.documentElement.requestFullscreen().then(() => {
                configPanel.style.display = 'none';
                isSoundEnabled = true; 
                isPlaying = true;
                beatCount = 0; 
                lastTimestamp = performance.now();
                runCountdown();
            }).catch(err => {
                alert(`フルスクリーンエラー: ${err.message}`);
            });
        });

        // カウントダウン制御
        function runCountdown() {
            countdownDisplay.style.display = 'block';
            let count = 3;
            countdownDisplay.textContent = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDisplay.textContent = count;
                } else {
                    clearInterval(timer);
                    countdownDisplay.style.display = 'none'; 
                    isSoundEnabled = false; 
                }
            }, 1000);
        }

        // フルスクリーン状態の変更
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                isPlaying = false;
                isSoundEnabled = false;
                leftCircle.style.opacity = 0;
                rightCircle.style.opacity = 0;
                countdownDisplay.style.display = 'none';
                configPanel.style.display = 'block';
            }
        });

        // アニメーションループ
        function loop(timestamp) {
            if (isPlaying) {
                const interval = 60000 / bpm; 
                const elapsed = timestamp - lastTimestamp;

                if (elapsed >= interval) {
                    if (mode === 'simultaneous') {
                        leftCircle.style.opacity = 0;
                        rightCircle.style.opacity = 1;
                        playTone(800, flashDuration); 
                    } else {
                        if (beatCount % 2 === 0) {
                            leftCircle.style.opacity = 0;
                            rightCircle.style.opacity = 1; 
                        } else {
                            leftCircle.style.opacity = 1;
                            rightCircle.style.opacity = 0; 
                        }
                        playTone(800, flashDuration); 
                    }
                    
                    beatCount++;
                    lastTimestamp = timestamp - (elapsed % interval); 
                } 
                else if (elapsed >= flashDuration) {
                    leftCircle.style.opacity = 0;
                    rightCircle.style.opacity = 0;
                }
            }
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
